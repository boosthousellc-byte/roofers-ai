<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Heartbeat Dashboard</title>
  <style>
    :root {
      --primary: #1a56db;
      --primary-dark: #1341a3;
      --accent: #f59e0b;
      --bg-dark: #0f172a;
      --bg-mid: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.10);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.18);
      --status-running: #22c55e;
      --status-error: #ef4444;
      --status-idle: #64748b;
      --status-completed: #1a56db;
      --status-pending: #f59e0b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    .dashboard-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
      padding: 16px 0;
    }

    .dashboard-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dashboard-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .dashboard-header h1 span {
      color: var(--accent);
    }

    /* Connection badge */
    .conn-badge {
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255,255,255,0.06);
    }

    .conn-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .conn-badge.connected { color: var(--status-running); }
    .conn-badge.connected::before { background: var(--status-running); }
    .conn-badge.disconnected { color: var(--status-error); }
    .conn-badge.disconnected::before { background: var(--status-error); }

    /* Stats bar */
    .stats-bar {
      background: var(--bg-mid);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 0;
    }

    .stats-row {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 14px;
      color: var(--text-muted);
    }

    .stat strong {
      color: var(--text-light);
      margin-left: 4px;
    }

    /* Agent grid */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      padding: 32px 0;
    }

    /* Agent card */
    .agent-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s ease;
      animation: fadeIn 0.3s ease;
    }

    .agent-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(255,255,255,0.14);
    }

    .agent-card.stale {
      opacity: 0.5;
    }

    .agent-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .agent-id {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* Status badge */
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border-radius: 99px;
    }

    .status-running  { background: rgba(34,197,94,0.15);  color: var(--status-running); }
    .status-error    { background: rgba(239,68,68,0.15);  color: var(--status-error); }
    .status-idle     { background: rgba(100,116,139,0.15); color: var(--text-muted); }
    .status-completed { background: rgba(26,86,219,0.15); color: var(--status-completed); }
    .status-pending  { background: rgba(245,158,11,0.15); color: var(--status-pending); }

    .agent-task {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Progress bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease, background-color 0.3s ease;
      background: var(--status-running);
    }

    .progress-label {
      font-size: 13px;
      font-weight: 700;
      min-width: 36px;
      text-align: right;
    }

    .agent-updated {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state h2 {
      font-size: 20px;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .agent-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    }

    @media (max-width: 600px) {
      .agent-grid { grid-template-columns: 1fr; }
      .stats-row { gap: 16px; }
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="container">
      <h1>Agent <span>Heartbeat</span></h1>
      <div id="connection-status" class="conn-badge">Connecting&hellip;</div>
    </div>
  </header>

  <div class="stats-bar">
    <div class="container stats-row">
      <div class="stat">Total: <strong id="stat-total">0</strong></div>
      <div class="stat">Running: <strong id="stat-running">0</strong></div>
      <div class="stat">Completed: <strong id="stat-completed">0</strong></div>
      <div class="stat">Error: <strong id="stat-error">0</strong></div>
    </div>
  </div>

  <main class="container">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">&#x1F4E1;</div>
      <h2>No agents reporting</h2>
      <p>Waiting for agent heartbeats&hellip;</p>
    </div>
    <div id="agent-grid" class="agent-grid" style="display:none;"></div>
  </main>

  <script>
    const STATUS_COLORS = {
      running:   'var(--status-running)',
      error:     'var(--status-error)',
      idle:      'var(--status-idle)',
      completed: 'var(--status-completed)',
      pending:   'var(--status-pending)'
    };

    let agentData = {};
    let eventSource = null;
    let reconnectDelay = 1000;

    function timeAgo(isoString) {
      const diff = Math.floor((Date.now() - new Date(isoString + 'Z').getTime()) / 1000);
      if (diff < 5) return 'just now';
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      return Math.floor(diff / 3600) + 'h ago';
    }

    function statusClass(status) {
      const s = (status || '').toLowerCase();
      if (['running', 'error', 'idle', 'completed', 'pending'].includes(s)) return 'status-' + s;
      return 'status-idle';
    }

    function createCard(id) {
      const card = document.createElement('div');
      card.className = 'agent-card';
      card.dataset.agentId = id;
      card.innerHTML =
        '<div class="agent-card-header">' +
          '<span class="agent-id"></span>' +
          '<span class="status-badge"></span>' +
        '</div>' +
        '<div class="agent-task"></div>' +
        '<div class="progress-wrap">' +
          '<div class="progress-bar"><div class="progress-fill"></div></div>' +
          '<span class="progress-label"></span>' +
        '</div>' +
        '<div class="agent-updated"></div>';
      return card;
    }

    function updateCard(card, id, agent) {
      card.querySelector('.agent-id').textContent = id;
      card.querySelector('.agent-task').textContent = agent.task || '—';

      const badge = card.querySelector('.status-badge');
      badge.textContent = agent.status || 'unknown';
      badge.className = 'status-badge ' + statusClass(agent.status);

      const progress = Math.max(0, Math.min(100, agent.progress || 0));
      const fill = card.querySelector('.progress-fill');
      fill.style.width = progress + '%';
      fill.style.background = STATUS_COLORS[(agent.status || '').toLowerCase()] || STATUS_COLORS.idle;
      card.querySelector('.progress-label').textContent = progress + '%';

      const updated = card.querySelector('.agent-updated');
      if (agent.last_update) {
        updated.textContent = 'Updated ' + timeAgo(agent.last_update);
        const diffSec = (Date.now() - new Date(agent.last_update + 'Z').getTime()) / 1000;
        card.classList.toggle('stale', diffSec > 30);
      } else {
        updated.textContent = '';
        card.classList.remove('stale');
      }
    }

    function updateStats() {
      const agents = Object.values(agentData);
      document.getElementById('stat-total').textContent = agents.length;
      document.getElementById('stat-running').textContent = agents.filter(a => (a.status || '').toLowerCase() === 'running').length;
      document.getElementById('stat-completed').textContent = agents.filter(a => (a.status || '').toLowerCase() === 'completed').length;
      document.getElementById('stat-error').textContent = agents.filter(a => (a.status || '').toLowerCase() === 'error').length;
    }

    function renderAgents() {
      const grid = document.getElementById('agent-grid');
      const empty = document.getElementById('empty-state');
      const ids = Object.keys(agentData);

      empty.style.display = ids.length === 0 ? 'flex' : 'none';
      grid.style.display = ids.length === 0 ? 'none' : 'grid';

      for (const id of ids) {
        let card = grid.querySelector('[data-agent-id="' + CSS.escape(id) + '"]');
        if (!card) {
          card = createCard(id);
          grid.appendChild(card);
        }
        updateCard(card, id, agentData[id]);
      }

      grid.querySelectorAll('.agent-card').forEach(function(card) {
        if (!ids.includes(card.dataset.agentId)) {
          card.remove();
        }
      });

      updateStats();
    }

    function setConnectionStatus(state) {
      const el = document.getElementById('connection-status');
      el.className = 'conn-badge ' + state;
      if (state === 'connected') el.textContent = 'Connected';
      else if (state === 'disconnected') el.textContent = 'Disconnected';
      else el.textContent = 'Connecting\u2026';
    }

    function connectSSE() {
      if (eventSource) { eventSource.close(); }
      setConnectionStatus('');

      eventSource = new EventSource('/stream/agents');

      eventSource.onopen = function() {
        setConnectionStatus('connected');
        reconnectDelay = 1000;
      };

      eventSource.onmessage = function(event) {
        try {
          agentData = JSON.parse(event.data);
          renderAgents();
        } catch (e) { /* skip malformed frames */ }
      };

      eventSource.onerror = function() {
        setConnectionStatus('disconnected');
        if (eventSource.readyState === EventSource.CLOSED) {
          setTimeout(connectSSE, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 2, 30000);
        }
      };
    }

    document.addEventListener('DOMContentLoaded', connectSSE);
  </script>
</body>
</html>
