name: Funnel Follow-up Emails

on:
  schedule:
    # Run every day at 9 AM UTC (2 AM MT / 3 AM PT)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no emails sent)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  send-followups:
    name: Advance email sequences
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run funnel automation sequence
        env:
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          FROM_EMAIL:         ${{ secrets.FROM_EMAIL }}
          FROM_NAME:          ${{ secrets.FROM_NAME }}
          OWNER_EMAIL:        ${{ secrets.OWNER_EMAIL }}
          AUDIT_LANDING_URL:  ${{ secrets.AUDIT_LANDING_URL }}
          BOOKING_URL:        ${{ secrets.BOOKING_URL }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python funnel_automations.py $FLAGS

      - name: Commit updated funnel_leads.csv
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funnel_leads.csv || true
          git diff --cached --quiet || git commit -m "chore: advance funnel email sequences [skip ci]"
          git push || true
